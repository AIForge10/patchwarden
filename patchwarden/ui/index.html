<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatchWarden Runs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./">PatchWarden</a>
    <form id="open-run" class="open-run">
      <input id="run-id" name="run" placeholder="run-…" autocomplete="off" aria-label="Run ID">
      <button type="submit">Open run</button>
      <label class="file-button">
        Play recording
        <input id="recording-file" type="file" accept="application/json,.json" hidden>
      </label>
    </form>
  </header>

  <main>
    <section id="home" class="panel" hidden>
      <h1>Recent runs</h1>
      <p class="muted">Signed alerts land here. Open one to follow it live.</p>
      <ul id="recent" class="recent"></ul>
      <h2>Recordings</h2>
      <ul id="recordings" class="recent"></ul>
    </section>

    <section id="run" hidden>
      <div class="panel summary">
        <div>
          <div class="muted small" id="mode-label"></div>
          <h1 id="run-title"></h1>
          <div class="muted" id="incident-line"></div>
        </div>
        <span id="status" class="status" data-tone="pending"></span>
      </div>

      <ol id="pipeline" class="pipeline" aria-label="Gate sequence"></ol>

      <div class="grid">
        <div class="panel">
          <h2>Timeline</h2>
          <ol id="timeline" class="timeline"></ol>
        </div>
        <aside class="panel">
          <h2>Evidence</h2>
          <div id="evidence"></div>
        </aside>
      </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
