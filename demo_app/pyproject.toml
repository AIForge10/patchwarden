# Checkout demo target app (Atina, B1). Runs its own pytest suite, separate from the agent's tests.
[project]
name = "checkout-demo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
